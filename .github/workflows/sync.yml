name: Update objekt purchase rankings
on:
  schedule:
    # New mint scans about every 15 minutes. GitHub may delay scheduled jobs.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = API test; sync = collect entire missing backlog'
        required: true
        type: choice
        options: [probe, sync]
        default: sync
      serial:
        description: 'serial for probe'
        required: false
        default: '1'
      max_items:
        description: 'Legacy parameter (ignored by full sync; kept for Worker compatibility)'
        required: false
        default: '72'
concurrency:
  group: objekt-ranking-collector
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies for sync
        if: github.event_name == 'schedule' || inputs.mode == 'sync'
        run: npm install --no-audit --no-fund
      - name: Probe only (no Firebase writes)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        env:
          SERIAL: ${{ inputs.serial }}
        run: npm run probe
      - name: Full backlog scan and checkpoint to Firebase
        if: github.event_name == 'schedule' || inputs.mode == 'sync'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FORCE_CATALOG_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'sync' && '1' || '0' }}
          SCAN_CONCURRENCY: '4'
          REQUEST_SPACING_MS: '450'
          CHECKPOINT_SIZE: '80'
          MAX_RUNTIME_MINUTES: '315'
        run: npm run sync
