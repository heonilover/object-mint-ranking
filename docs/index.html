<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101219">
  <meta name="description" content="tripleS CC372Z·373Z·374Z 멤버별 최초 수령자 구매량 TOP 5">
  <title>tripleS · CC 구매량 TOP 5</title>
  <style>
    :root{color-scheme:dark;--bg:#101219;--card:#1b1f2a;--edge:#313744;--ink:#f5f7fb;--soft:#a5acbc;--accent:#d6c9ff;--muted:#7f899b}
    *{box-sizing:border-box}html{min-width:320px}body{margin:0;background:radial-gradient(ellipse at 88% 0,#24213a 0,transparent 34%),var(--bg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",Segoe UI,Arial,sans-serif;color:var(--ink)}
    .page{max-width:1610px;margin:0 auto;padding:30px 30px 26px}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding-bottom:23px}
    .overline{font-size:10px;font-weight:800;color:var(--accent);letter-spacing:.22em;margin-bottom:7px}
    h1{font-size:clamp(22px,2.45vw,34px);letter-spacing:-.055em;line-height:1.19;margin:0;font-weight:800}h1 span{color:var(--accent)}
    .sub{color:var(--soft);margin:7px 0 0;font-size:12px}
    .meta{text-align:right;font-size:11px;color:var(--soft);white-space:nowrap;padding-bottom:3px}
    .meta strong{display:block;font-size:12px;color:var(--ink);font-weight:600;margin-bottom:4px}
    .header-right{display:flex;flex-direction:column;gap:9px;align-items:flex-end;flex-shrink:0}
    .sync-link{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #7561af;background:#393052;color:#f6f0ff;border-radius:10px;padding:9px 13px;font-size:12px;font-weight:750;transition:background .15s;cursor:pointer;font-family:inherit}
    .sync-link:hover,.sync-link:focus-visible{background:#4f4077;outline-offset:3px}
    .sync-link:disabled{cursor:progress;opacity:.62}
    .manual-hint{max-width:310px;font-size:10px;color:var(--muted);text-align:right;line-height:1.4}
    .manual-hint.error{color:#fc9999}
    .manual-hint.ok{color:#81dab4}
    @media(max-width:720px){.header-right{align-items:flex-start}.manual-hint{text-align:left}.sync-link{padding:8px 12px}}
    @media(max-width:465px){.header-right{width:100%}}
    .dot{display:inline-block;width:7px;height:7px;background:#e6be71;border-radius:50%;margin-right:6px;vertical-align:middle}
    .dot.ok{background:#76d4ac}.dot.err{background:#fc8585}
    .notice{margin:0 0 14px;border:1px solid #604148;background:#312126;border-radius:10px;color:#ffd4dc;padding:9px 12px;font-size:12px;display:none}.notice.visible{display:block}
    .cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
    .card{border:1px solid var(--edge);border-radius:14px;background:linear-gradient(155deg,#222532,var(--card) 68%);min-width:0;box-shadow:0 8px 24px rgba(0,0,0,.09);overflow:hidden}
    .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--edge);padding:13px 14px 11px;min-height:66px}
    .identity{min-width:0}.english{font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--muted);margin-bottom:1px}
    .member{font-size:19px;letter-spacing:-.045em;font-weight:800;line-height:1.22}
    .s-num{font-size:10px;color:var(--soft);font-weight:600;margin-left:5px;white-space:nowrap}
    .status{flex-shrink:0;max-width:102px;text-align:right;font-size:10px;line-height:1.25;color:var(--soft)}
    .status strong{display:block;color:var(--accent);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
    .status.complete strong{color:#7cdbb2}.status.pending strong{color:#dac9af}
    .ranking{margin:0;padding:7px 9px 8px;list-style:none}
    .ranking li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:7px;padding:7px 5px;min-height:36px;border-radius:6px}
    .ranking li+li{border-top:1px solid #2a2e3a;border-radius:0}
    .place{color:var(--muted);font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center}
    .ranking li:first-child .place{color:#f1d795}.ranking li:nth-child(2) .place{color:#ced6e6}.ranking li:nth-child(3) .place{color:#ddb29f}
    .nickname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:650;min-width:0}
    .count{font-size:13px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
    .count small{color:var(--soft);font-size:10px;font-weight:500;margin-left:1px}
    .placeholder .nickname,.placeholder .place,.placeholder .count{color:#687183;font-weight:400}
    .card-foot{border-top:1px solid var(--edge);padding:7px 12px;font-size:10px;color:var(--muted);background:rgba(0,0,0,.065)}
    .card-foot.warn{color:#f0bb86}
    footer{display:flex;gap:10px;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;padding-top:18px}
    footer a{color:var(--soft)}
    @media(max-width:1299px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:1000px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:720px){.page{padding:20px 16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}header{align-items:flex-start} .card-head{padding:11px}.member{font-size:17px} .meta{font-size:10px}}
    @media(max-width:465px){.cards{grid-template-columns:1fr}.card-head{min-height:56px}.ranking{padding-top:4px;padding-bottom:4px}.ranking li{min-height:34px}header{flex-direction:column;gap:6px}.meta{text-align:left}footer{display:block}footer span{display:block;margin-top:3px}}
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <div class="overline">TRIPLES · CREAM02</div>
        <h1>가장 많이 민팅한 사람은? <span>TOP 5</span></h1>
        <p class="sub">멤버별 CC372Z · CC373Z · CC374Z 합산 · 최초 수령 기록 기준</p>
      </div>
      <div class="header-right">
        <div class="meta" aria-live="polite">
          <strong><span class="dot" id="dot"></span><span id="connection">Firebase 연결 중</span></strong>
          <span id="updated">마지막 집계 확인 중</span>
        </div>
        <button type="button" class="sync-link" id="refreshNowBtn" aria-label="현재 페이지에서 신규 오브젝트 데이터 수집 요청">↻ 지금 업데이트</button>
        <div class="manual-hint" id="refreshStatus" role="status" aria-live="polite">새 기록은 자동으로 수집되며, 직접 수집을 요청할 수도 있어요.</div>
      </div>
    </header>
    <div id="notice" class="notice" role="status"></div>
    <section class="cards" id="cards" aria-label="10명 멤버별 구매량 TOP 5"></section>
    <footer><span>같은 지갑의 최초 수령 수량만 합산 · 수집 중 순위는 잠정 수치</span><span>Data: <a href="https://objekt.top/?artist=tripleS" target="_blank" rel="noopener noreferrer">objekt.top</a></span></footer>
  </main>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
  import { getFirestore, collection, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
  import { firebaseConfig } from './config.js';
  const REFRESH_API_URL = 'https://objekt-ranking-refresh.pespor2.workers.dev';

  // These member keys match the backend's src/collections.mjs slug convention.
  const members = [
    ['혜린','HyeRin','hyerin',2],
    ['지우','JiWoo','jiwoo',3],
    ['수민','SooMin','soomin',6],
    ['유빈','YuBin','yubin',8],
    ['다현','DaHyun','dahyun',10],
    ['니엔','Nien','nien',13],
    ['소현','SoHyun','sohyun',14],
    ['시온','ShiOn','shion',20],
    ['설린','Sullin','sullin',22],
    ['서아','SeoAh','seoah',23],
  ].map(([name,english,key,number]) => ({name,english,key,number,slugs:[372,373,374].map(n=>`cream02-${key}-${n}z`)}));
  const $ = id => document.getElementById(id);
  const nfmt = n => Math.max(0,Number(n)||0).toLocaleString('ko-KR');
  const state = {shards:new Map(),status:null,shardsLoaded:false,statusLoaded:false,failed:false,refreshRequestedAt:0,refreshPending:false};
  const nodes = new Map();
  
  function el(tag, cls, value) {
    const node = document.createElement(tag);
    if (cls) node.className=cls;
    if (value!==undefined) node.textContent=String(value);
    return node;
  }
  function createCard(m) {
    const card=el('article','card');
    const head=el('div','card-head');
    const identity=el('div','identity');
    identity.append(el('div','english',m.english+' · S'+m.number));
    identity.append(el('div','member',m.name));
    const status=el('div','status pending');
    status.append(el('strong','', '대기 중'));
    status.append(el('span','', 'CC372–374'));
    head.append(identity,status);
    const ranking=el('ol','ranking');
    for(let i=0;i<5;i++) ranking.append(row(i+1,null));
    const foot=el('div','card-foot','최초 수령 기준 · 수집 전');
    card.append(head,ranking,foot);
    nodes.set(m.key,{status,ranking,foot});
    return card;
  }
  function row(rank,buyer) {
    const li=el('li',buyer?'':'placeholder');
    li.append(el('span','place',rank));
    const name=el('span','nickname',buyer?.name || '—');
    if(buyer?.name) name.title=buyer.name;
    li.append(name);
    const count=el('span','count');
    if(buyer){count.append(document.createTextNode(nfmt(buyer.total)));count.append(el('small','', '장'));}
    else count.textContent='—';
    li.append(count);
    return li;
  }
  $('cards').replaceChildren(...members.map(createCard));

  function isValidWallet(w) { return /^0x[0-9a-f]{40}$/i.test(w); }
  function rowsForMember(m) {
    const all=[];
    for(const shard of state.shards.values()) {
      for(const [wallet,buyer] of Object.entries(shard?.buyers||{})) {
        const count=m.slugs.reduce((sum,slug)=>sum+(Number(buyer?.bySlug?.[slug])||0),0);
        if(count<=0) continue;
        const name=(typeof buyer.nickname==='string' && buyer.nickname.trim()) ? buyer.nickname.trim() : isValidWallet(wallet) ? wallet.slice(0,8)+'…'+wallet.slice(-4) : '이름 없음';
        all.push({wallet,name,total:count});
      }
    }
    all.sort((a,b)=>b.total-a.total || a.wallet.localeCompare(b.wallet));
    let last=null,rank=0;
    return all.slice(0,5).map((r,i)=>{
      if(r.total!==last)rank=i+1;
      last=r.total;
      return {...r,rank};
    });
  }
  function render() {
    const ready=state.shardsLoaded && state.statusLoaded;
    const progress=state.status?.collections||[];
    const statuses=new Map(progress.map(p=>[p.slug,p]));
    let relevant=0;
    for(const m of members) {
      const ui=nodes.get(m.key);
      const rows=ready?rowsForMember(m):[];
      const frag=document.createDocumentFragment();
      for(let i=0;i<5;i++)frag.append(row(rows[i]?.rank??i+1,rows[i]));
      ui.ranking.replaceChildren(frag);
      const records=m.slugs.map(s=>statuses.get(s)).filter(Boolean);
      relevant+=records.length;
      const done=records.reduce((n,p)=>n+(Number(p.done)||0),0);
      const total=records.reduce((n,p)=>n+(Number(p.total)||0),0);
      const errors=records.filter(p=>p.error).length;
      const completed=records.length===3 && total>0 && done>=total && errors===0;
      ui.status.className='status'+(completed?' complete': ' pending');
      ui.status.firstChild.textContent=!ready?'연결 중':!records.length?'수집 전':completed?'집계 완료':'집계 중';
      ui.status.lastChild.textContent=records.length ? `${nfmt(done)} / ${nfmt(total)}` : 'CC372–374';
      ui.foot.className='card-foot'+(errors?' warn':'');
      ui.foot.textContent=!ready?'Firebase 데이터 확인 중':errors?'일부 데이터 조회 오류':!records.length?'새 오브젝트 수집 대기':!total?'발행 목록 확인 대기':completed?'전체 발행 시리얼 기준':'수집된 시리얼 기준 · 잠정 순위';
    }
    if(state.status?.lastRunAt && relevant) {
      const d=new Date(state.status.lastRunAt);
      if(!Number.isNaN(d.getTime()))$('updated').textContent='마지막 집계 '+new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d);
    } else $('updated').textContent=relevant?'수집 상태 확인 중':'신규 수집 대기';
    if(ready && !state.failed) {
      $('dot').className='dot ok';
      $('connection').textContent=relevant?'Firestore 연결됨':'Firestore 연결됨 · 신규 수집 대기';
    }
    if (state.refreshPending && Number.isFinite(Date.parse(state.status?.lastRunAt || ''))) {
      if (Date.parse(state.status.lastRunAt) >= state.refreshRequestedAt - 3000) {
        state.refreshPending=false;
        setRefreshMessage('수집 작업이 끝나 Firebase 결과를 반영했어요. 새 수집량: '+nfmt(state.status?.latestBatch)+'장','ok');
      }
    }
    const errors=(state.status?.errors||[]).filter(t=>members.some(m=>t.includes(m.name) || m.slugs.some(s=>t.includes(s))));
    const notice=$('notice');
    if(errors.length && ready){notice.textContent='수집 오류: '+errors[0];notice.classList.add('visible');}
    else if(!state.failed){notice.textContent='';notice.classList.remove('visible');}
  }
  function error(message) {
    state.failed=true;
    $('dot').className='dot err';
    $('connection').textContent='Firebase 연결 실패';
    const notice=$('notice');notice.textContent=message;notice.classList.add('visible');
  }

  // A Cloudflare Worker is needed only for safely triggering GitHub Actions.
  // Never put a GitHub token in this public site.
  const refreshButton=$('refreshNowBtn');
  function setRefreshMessage(message,kind='') {
    const node=$('refreshStatus');
    node.textContent=message;
    node.className='manual-hint'+(kind?' '+kind:'');
  }
  refreshButton.addEventListener('click',async()=>{
    if(!REFRESH_API_URL || !/^https:\/\/[^/]+/.test(REFRESH_API_URL)) {
      setRefreshMessage('수동 갱신 주소가 아직 설정되지 않았어요. refresh-config.js 설정이 필요합니다.','error');
      return;
    }
    refreshButton.disabled=true;
    refreshButton.textContent='↻ 수집 요청 중…';
    setRefreshMessage('신규 시리얼 수집을 요청하고 있어요.');
    try {
      const response=await fetch(REFRESH_API_URL,{
        method:'POST',
        mode:'cors',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({}),
        cache:'no-store'
      });
      const data=await response.json().catch(()=>({}));
      if(response.status===429 && data.busy){
        setRefreshMessage(data.message || '수집 중이므로 새 실행을 만들지 않았어요.','ok');
        refreshButton.disabled=false;
        refreshButton.textContent='↻ 지금 업데이트';
        return;
      }
      if(!response.ok || !data.ok){
        throw new Error(data.error || 'HTTP '+response.status);
      }
      state.refreshRequestedAt=Date.now();
      state.refreshPending=true;
      setRefreshMessage('요청 완료! 수집 작업이 실행되면 새 기록이 Firebase에 저장되고 순위에 자동 반영돼요.','ok');
      // Keep duplicate button presses away while a job is likely running.
      setTimeout(()=>{
        refreshButton.disabled=false;
        refreshButton.textContent='↻ 지금 업데이트';
        if(state.refreshPending)setRefreshMessage('수집 대기 또는 진행 중이에요. 저장되면 이 화면에 자동 반영됩니다.');
      },10000);
    }catch(e){
      refreshButton.disabled=false;
      refreshButton.textContent='↻ 지금 업데이트';
      setRefreshMessage('요청 실패: '+String(e?.message||e)+' · 수집 작업은 시작되지 않았을 수 있어요.','error');
    }
  });

  if(!firebaseConfig?.projectId || !firebaseConfig?.appId){ error('Firebase 웹 앱 설정이 비어 있습니다. docs/config.js를 확인하세요.'); }
  else {
    try {
      const db=getFirestore(initializeApp(firebaseConfig));
      onSnapshot(doc(db,'public','status'),snap=>{state.status=snap.exists()?snap.data():null;state.statusLoaded=true;render();},e=>error('Firestore 수집 상태를 읽을 수 없습니다: '+e.message));
      onSnapshot(collection(db,'rankShards'),snap=>{
        for(const change of snap.docChanges()){
          if(change.type==='removed')state.shards.delete(change.doc.id);
          else state.shards.set(change.doc.id,change.doc.data());
        }
        state.shardsLoaded=true;render();
      },e=>error('Firestore 랭킹을 읽을 수 없습니다: '+e.message));
    } catch(e) {error('Firebase 초기화 오류: '+e.message);}
  }
</script>
</body>
</html>
